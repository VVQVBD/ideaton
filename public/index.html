<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ec">
  <title>MVR Education Platform</title>
  <!-- Значок вкладки браузера -->
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <script>try{var th=localStorage.getItem('theme');document.documentElement.dataset.theme=th==='dark'?'dark':'light';}catch(e){document.documentElement.dataset.theme='light';}</script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/fx.css">
</head>
<body>
  <div class="paper" aria-hidden="true"></div>
  <!-- Экран входа: студенты по коду игры, преподаватель по PIN (/teacher) -->
  <div id="auth" class="auth"></div>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="center">
      <header id="topbar" class="topbar"></header>
      <main id="main" class="main"></main>
    </div>
    <aside id="panel" class="panel"></aside>
  </div>
  <button id="fab" class="fab" data-act="panel" type="button"></button>
  <div id="scrim" class="scrim" data-act="panel"></div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts"></div>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/confetti.min.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
